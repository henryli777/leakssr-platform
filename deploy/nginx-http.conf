server {
    listen 80;
    listen [::]:80;
    server_name leakssr.coinexo.top;

    access_log /var/log/nginx/leakssr-platform-access.log;
    error_log /var/log/nginx/leakssr-platform-error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/leakssr-platform-static.conf;
}
