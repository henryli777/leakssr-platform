server {
    listen 80;
    listen [::]:80;
    server_name leakssr.coinexo.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://leakssr.coinexo.top$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name leakssr.coinexo.top;

    ssl_certificate /etc/letsencrypt/live/leakssr.coinexo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leakssr.coinexo.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:leakssr_platform_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/leakssr-platform-access.log;
    error_log /var/log/nginx/leakssr-platform-error.log;
    add_header Strict-Transport-Security "max-age=15552000" always;

    include /etc/nginx/snippets/leakssr-platform-static.conf;
}
